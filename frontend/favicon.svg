<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="twPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a970ff"/>
      <stop offset="100%" stop-color="#9146ff"/>
    </linearGradient>
    <linearGradient id="scissorSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#9146ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container Base -->
  <rect width="64" height="64" rx="15" fill="#0e0e10"/>
  <rect x="1" y="1" width="62" height="62" rx="14" stroke="#9146ff" stroke-width="1.8" stroke-opacity="0.4"/>

  <!-- 1. TWITCH ICONIC GLITCH MASCOT (Instantly Recognizable Official Silhouette) -->
  <g filter="url(#neonGlow)">
    <!-- Main Speech Bubble Body -->
    <path d="M15 9 L8 16 V44 H18 V52 L26 44 H34 L48 30 V9 H15 Z" fill="url(#twPurple)"/>
    
    <!-- Twitch Signature Vertical Dual Eyes (Solid White) -->
    <rect x="22" y="19" width="4.5" height="12" rx="1.2" fill="#ffffff"/>
    <rect x="32" y="19" width="4.5" height="12" rx="1.2" fill="#ffffff"/>
  </g>

  <!-- 2. CLIPPER / CUTTER SCISSORS (Slicing Diagonally across the Twitch Icon) -->
  <!-- Upper Scissor Finger Loop (Handle) -->
  <circle cx="51" cy="47" r="6" stroke="#ffffff" stroke-width="2.6" fill="#0e0e10"/>
  <path d="M46 43 L40 34" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Lower Scissor Finger Loop (Handle) -->
  <circle cx="51" cy="19" r="6" stroke="#ffffff" stroke-width="2.6" fill="#0e0e10"/>
  <path d="M46 23 L40 32" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Top Cutting Blade (Slicing through towards upper-left) -->
  <path d="M39 34 L18 16 L21 13 L42 31 Z" fill="url(#scissorSteel)"/>
  <path d="M39 34 L18 16" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bottom Cutting Blade (Slicing through towards lower-left) -->
  <path d="M39 32 L15 42 L18 45 L42 35 Z" fill="url(#scissorSteel)"/>
  <path d="M39 32 L15 42" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Pivot Screw / Rivet (Electric Neon Accent) -->
  <circle cx="40" cy="33" r="3.6" fill="#0e0e10" stroke="#00f59b" stroke-width="1.8"/>
  <circle cx="40" cy="33" r="1.3" fill="#ffffff"/>

  <!-- Dashed Cutting Trail (Dotted cut mark showing clean slice) -->
  <path d="M16 14 L10 8" stroke="#00f59b" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round"/>

  <!-- Electric Cut Sparkle (Action gleam at cutting apex) -->
  <path d="M25 21 L26.5 17.5 L28 21 L31.5 22.5 L28 24 L26.5 27.5 L25 24 L21.5 22.5 Z" fill="#00f59b"/>
  <circle cx="26.5" cy="22.5" r="0.8" fill="#ffffff"/>
</svg>
