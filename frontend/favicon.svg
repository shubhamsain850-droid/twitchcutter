<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="twPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf94ff"/>
      <stop offset="50%" stop-color="#9146ff"/>
      <stop offset="100%" stop-color="#6441a5"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9146ff"/>
    </linearGradient>
    <linearGradient id="neonCut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#9146ff"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container Base -->
  <rect width="64" height="64" rx="15" fill="#0e0e10"/>
  <rect x="1" y="1" width="62" height="62" rx="14" stroke="#9146ff" stroke-width="1.8" stroke-opacity="0.5"/>

  <!-- Left Side: Twitch 'Glitch' Chat Mascot Contours / Scissor Handles -->
  <!-- Top Handle Loop -->
  <path d="M12 24C12 18.5 16.5 14 22 14C27.5 14 31 18.5 30 24L26 27C24.5 28.5 22 28.5 19 28L15 27C13 26.5 12 25.5 12 24Z" fill="url(#twPurple)"/>
  <circle cx="21" cy="21" r="3.5" fill="#0e0e10"/>

  <!-- Bottom Handle Loop -->
  <path d="M12 40C12 45.5 16.5 50 22 50C27.5 50 31 45.5 30 40L26 37C24.5 35.5 22 35.5 19 36L15 37C13 37.5 12 38.5 12 40Z" fill="url(#twPurple)"/>
  <circle cx="21" cy="43" r="3.5" fill="#0e0e10"/>

  <!-- Twitch Signature Dual Vertical Eyes inside the handle base -->
  <rect x="15" y="28" width="3" height="8" rx="1" fill="#ffffff"/>
  <rect x="21" y="28" width="3" height="8" rx="1" fill="#ffffff"/>

  <!-- Top Razor Blade (Cutting Upward Diagonally) -->
  <path d="M28 35L52 14C53.5 12.5 55 14 54 16L42 30L33 36Z" fill="url(#bladeGrad)"/>
  <path d="M28 35L52 14" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bottom Razor Blade (Cutting Downward Diagonally) -->
  <path d="M28 29L52 50C53.5 51.5 55 50 54 48L42 34L33 28Z" fill="url(#bladeGrad)"/>
  <path d="M28 29L52 50" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Central Pivot Rivet / Screw -->
  <circle cx="29" cy="32" r="4.5" fill="#0e0e10" stroke="#9146ff" stroke-width="2.2"/>
  <circle cx="29" cy="32" r="1.8" fill="#ffffff"/>

  <!-- Electric Cutting Sparkles at the Shearing Intersection -->
  <path d="M51 32L53 29L55 32L58 32L55.5 34L56.5 37L54 35L51.5 37L52.5 34L50 32Z" fill="#00f59b"/>
  <circle cx="53.5" cy="32.5" r="1" fill="#ffffff"/>
</svg>
